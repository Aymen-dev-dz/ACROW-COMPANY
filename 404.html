<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Page Introuvable | ACROW DZ</title>
  <meta name="theme-color" content="#003366">
  <link rel="icon" type="image/png" href="assets/images/logo.png">

  <!-- Google Fonts & Bootstrap 5 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800;900&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

  <style>
    :root {
      --primary-blue: #003366;
      --accent-red: #cc0000;
      --text-dark: #0f172a;
      --text-muted: #64748b;
    }
    * { box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      color: var(--text-dark);
      background: radial-gradient(circle at 50% 20%, #f8fafc 0%, #edf2f7 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 30px 20px;
      margin: 0;
      text-align: center;
    }
    .brand-logo {
      height: 60px;
      width: auto;
      object-fit: contain;
      margin-bottom: 28px;
    }
    .card-404 {
      background: #ffffff;
      border: 1.5px solid rgba(0, 51, 102, 0.08);
      border-radius: 24px;
      padding: 44px 36px;
      max-width: 580px;
      width: 100%;
      box-shadow: 0 16px 45px rgba(0, 26, 51, 0.08);
    }
    .code-404 {
      font-family: 'Outfit', sans-serif;
      font-size: clamp(4.5rem, 12vw, 6.5rem);
      font-weight: 900;
      line-height: 1;
      color: var(--primary-blue);
      letter-spacing: -2px;
      margin-bottom: 10px;
    }
    .code-404 span {
      color: var(--accent-red);
    }
    .title-404 {
      font-family: 'Outfit', sans-serif;
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--text-dark);
      margin-bottom: 14px;
    }
    .desc-404 {
      color: var(--text-muted);
      font-size: 1rem;
      line-height: 1.6;
      margin-bottom: 28px;
    }
    .btn-group-404 {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
    }
    .btn-acrow-red {
      background: linear-gradient(135deg, var(--accent-red) 0%, #a80000 100%);
      color: #fff !important;
      font-weight: 700;
      padding: 12px 26px;
      border-radius: 50px;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: none;
      transition: all 0.25s ease;
      box-shadow: 0 6px 20px rgba(204, 0, 0, 0.3);
    }
    .btn-acrow-red:hover {
      background: linear-gradient(135deg, #e60000 0%, #bf0000 100%);
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(204, 0, 0, 0.45);
    }
    .btn-acrow-outline {
      background: transparent;
      color: var(--primary-blue) !important;
      font-weight: 700;
      padding: 12px 24px;
      border-radius: 50px;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: 1.5px solid var(--primary-blue);
      transition: all 0.25s ease;
    }
    .btn-acrow-outline:hover {
      background: var(--primary-blue);
      color: #fff !important;
      transform: translateY(-2px);
    }
    .footer-404 {
      margin-top: 24px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <div class="card-404">
    <a href="index.html">
      <img src="assets/images/logo.png" alt="ACROW DZ" class="brand-logo">
    </a>

    <div class="code-404">4<span>0</span>4</div>
    <h1 class="title-404">Page introuvable ou déplacée</h1>
    <p class="desc-404">
      L'adresse demandée n'existe pas ou le fichier a été renommé. Vous pouvez revenir à la page d'accueil ou demander directement un devis technique.
    </p>

    <div class="btn-group-404">
      <a href="index.html" class="btn-acrow-red">
        <i class="bi bi-house-door-fill"></i> Retour à l'accueil
      </a>
      <a href="devis.html" class="btn-acrow-outline">
        <i class="bi bi-file-earmark-text"></i> Demander un devis
      </a>
    </div>

    <div class="footer-404">
      Besoin d'assistance ? Contactez-nous au <strong>028 23 09 45</strong> ou via <a href="https://wa.me/21328230945" target="_blank" class="text-danger fw-bold text-decoration-none">WhatsApp</a>.
    </div>
  </div>

</body>
</html>
