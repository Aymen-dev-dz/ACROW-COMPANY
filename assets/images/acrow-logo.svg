<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 86" width="320" height="86" fill="none">
  <!-- ACROW Text -->
  <text x="5" y="44" font-family="'Montserrat', 'Arial Black', sans-serif" font-size="44" font-weight="900" fill="#1C1844" letter-spacing="0.02em">ACROW</text>
  
  <!-- Red Dynamic Line -->
  <path d="M 6 52 Q 100 50, 180 54 L 180 57 Q 100 53, 6 54 Z" fill="url(#acrowRedGrad)" />
  
  <!-- Formwork Technology Subtitle -->
  <text x="6" y="70" font-family="'Montserrat', 'Segoe UI', sans-serif" font-size="14.5" font-weight="600" fill="#2A2458" letter-spacing="0.06em">Formwork Technology</text>
  
  <!-- Tiered Isometric Slabs/Plates Emblem -->
  <g transform="translate(195, 8)">
    <!-- Layer 1 (Top - Dark Navy) -->
    <polygon points="45,4 95,20 50,35 0,19" fill="none" stroke="#1C1844" stroke-width="2.5" stroke-linejoin="round"/>
    
    <!-- Layer 2 (Red) -->
    <path d="M 0,28 L 50,44 L 95,29" fill="none" stroke="#C8102E" stroke-width="2.5" stroke-linejoin="round"/>
    
    <!-- Layer 3 (Red) -->
    <path d="M 0,37 L 50,53 L 95,38" fill="none" stroke="#C8102E" stroke-width="2.5" stroke-linejoin="round"/>
    
    <!-- Layer 4 (Bottom - Red) -->
    <path d="M 0,46 L 50,62 L 95,47" fill="none" stroke="#C8102E" stroke-width="2.5" stroke-linejoin="round"/>
  </g>

  <!-- Definitions -->
  <defs>
    <linearGradient id="acrowRedGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C8102E" stop-opacity="0.2"/>
      <stop offset="25%" stop-color="#C8102E" stop-opacity="1"/>
      <stop offset="100%" stop-color="#990012" stop-opacity="1"/>
    </linearGradient>
  </defs>
</svg>
