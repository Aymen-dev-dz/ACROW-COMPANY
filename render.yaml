# ==========================================
# Render.com Blueprint — ACROW DZ Static Site
# ==========================================

services:
  - type: web
    name: acrow-dz
    env: static
    buildCommand: ""
    staticPublishPath: .
    pullRequestPreviewsEnabled: false

    # Redirections d'URL & 404
    routes:
      - type: rewrite
        source: /devis
        destination: /devis.html
      - type: rewrite
        source: /accueil
        destination: /index.html
      - type: rewrite
        source: /home
        destination: /index.html

    # En-têtes HTTP de sécurité & mise en cache CDN
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /pdf/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*.mp4
        name: Cache-Control
        value: public, max-age=2592000
      - path: /*.mp4
        name: Accept-Ranges
        value: bytes
